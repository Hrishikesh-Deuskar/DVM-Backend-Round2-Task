<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard</title>
</head>
<body>

    <h1>Customer Dashboard</h1>

    <p>Welcome, {{ request.user.username }}!</p>

    <p>You will soon be able to browse events,
       add wallet money, and book tickets here.</p>

    <a href="{% url 'events:event_list' %}">
        Browse Events
    </a>

    <p>
        <a href="{% url 'wallet:dashboard' %}">
            My Wallet
        </a>
    </p>

    <p>
        <a href="{% url 'bookings:history' %}">
            My Bookings
        </a>
    </p>

    <p>
        <a href="{% url 'bookings:active_tickets' %}">
            My Active Tickets
        </a>
    </p>

    <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

</body>
</html>
