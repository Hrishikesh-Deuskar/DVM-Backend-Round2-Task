<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validate Ticket | OutingHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 700px;">

    <a href="{% url 'organization:dashboard' organization.id %}"
       class="btn btn-outline-secondary mb-4">
        Dashboard
    </a>

    <h1>Validate Ticket</h1>

    <p class="text-muted">{{ organization.name }}</p>

    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}

    <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div class="mb-3">
            {{ form.ticket_id.label_tag }}
            {{ form.ticket_id }}

            {% for error in form.ticket_id.errors %}
                <div class="text-danger small">{{ error }}</div>
            {% endfor %}
        </div>

        <button type="submit" class="btn btn-success">
            Consume Ticket
        </button>
    </form>

</div>
</body>
</html>
